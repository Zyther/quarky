[env:cardputer-adv]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
    ; DO NOT add -DBOARD_HAS_PSRAM here. It used to be in this list and it
    ; crash-looped the board forever, ~225ms after every reset, before
    ; setup() was ever reached:
    ;
    ;   E (225) quad_psram: PSRAM chip is not connected, or wrong PSRAM line mode
    ;   Guru Meditation Error: Core 0 panic'ed (LoadProhibited)
    ;   EXCVADDR: 0x00000004
    ;   Backtrace: systimer_hal_get_counter_value <- esp_timer_impl_get_time
    ;              <- psramInit (esp32-hal-psram.c:73)   [addr2line-decoded]
    ;
    ; 1. This board genuinely has no PSRAM. The Cardputer-ADV's SoC is an
    ;    ESP32-S3FN8 (M5Stack's own spec page,
    ;    https://docs.m5stack.com/en/core/Cardputer-Adv). "FN8" is Espressif's
    ;    naming for flash-only / no in-package PSRAM / 8MB flash -- there is
    ;    no R2/R8 PSRAM-die suffix. Two independent third-party board
    ;    definitions for this exact hardware (unigeek's m5_cardputer_adv.json,
    ;    Bruce's m5stack-cardputer-adv.json) both declare
    ;    maximum_ram_size = 327680, i.e. the ESP32-S3's internal SRAM and
    ;    nothing more. The `m5stack-stamps3` board used here declares the same
    ;    327680, so no board JSON override is needed. So esp_psram_init()
    ;    probing QSPI PSRAM at CLK=30/CS=26 was always going to fail.
    ;
    ; 2. -DBOARD_HAS_PSRAM is not merely an app-level "#ifdef this if you want
    ;    ps_malloc" hint -- against precompiled Arduino libs it is *the*
    ;    switch that turns Arduino's PSRAM bring-up on. cores/esp32/
    ;    esp32-hal-psram.h:25-32 reads:
    ;        #if defined(ESP32_ARDUINO_LIB_BUILDER) && !defined(BOARD_HAS_PSRAM)
    ;        #undef CONFIG_SPIRAM_SUPPORT
    ;        #undef CONFIG_SPIRAM
    ;        #endif
    ;    ESP32_ARDUINO_LIB_BUILDER is always defined by pioarduino-build.py, so
    ;    without BOARD_HAS_PSRAM the core sees CONFIG_SPIRAM as undefined even
    ;    though the precompiled sdkconfig has CONFIG_SPIRAM=y. That in turn
    ;    compiles out both halves of the crash:
    ;      - esp32-hal-psram.c falls into its `#else` branch, so psramInit()
    ;        becomes a 7-byte `return false` stub (verified: .text.psramInit
    ;        shrinks from 0x8f to 0x07 bytes in the object file), and
    ;      - esp32-hal-misc.c:299-303's
    ;            ESP_SYSTEM_INIT_FN(init_psram_new, CORE, BIT(0), 99)
    ;              { psramInit(); }
    ;        is never registered at all (verified: the symbol disappears from
    ;        the linked ELF's system-init-fn array).
    ;
    ; 3. Why the failed probe was *fatal* rather than just noisy: that
    ;    ESP_SYSTEM_INIT_FN runs at CORE priority 99, ahead of esp_timer's own
    ;    init fn, so esp_timer's systimer HAL context is still all-zero.
    ;    psramInit() reports the failure with
    ;    ESP_EARLY_LOGW(TAG, "PSRAM init failed!"), and Arduino does not use
    ;    IDF's ESP_EARLY_LOGW -- cores/esp32/esp32-hal-log.h:327/338 #undef's
    ;    it and redefines it as isr_log_w(), whose ARDUHAL_LOG_FORMAT prepends
    ;    a timestamp from esp_timer_get_time(). (Confirmed in the objdump of
    ;    the crashing build: psramInit+0x2f is `l32r a8, esp_timer_get_time;
    ;    callx8 a8`.) esp_timer_get_time() -> esp_timer_impl_get_time() ->
    ;    systimer_hal_get_counter_value() then loads through the null hal->dev
    ;    at offset 4 -> LoadProhibited, EXCVADDR 0x00000004, panic, reboot,
    ;    repeat forever.
    ;
    ;    Note the second-order consequence: that log line only exists because
    ;    ARDUHAL_LOG_LEVEL (= CORE_DEBUG_LEVEL, below) is >= WARN. At the
    ;    PlatformIO default of 0 it compiles to `do {} while (0)`, which is why
    ;    no-PSRAM ESP32-S3 boards usually survive a mis-set BOARD_HAS_PSRAM.
    ;    We hit the panic because we set both. Bruce's real-hardware Cardputer
    ;    build sidesteps it the other way, pinning -DCORE_DEBUG_LEVEL=0
    ;    (boards/m5stack-cardputer/m5stack-cardputer.ini). We keep level 3 --
    ;    the diagnostics are worth more than the redundancy -- and fix the
    ;    actual falsehood instead by not claiming PSRAM this board lacks.
    ;
    ; Nothing under src/ referenced BOARD_HAS_PSRAM, ps_malloc(), or
    ; heap_caps_malloc(..., MALLOC_CAP_SPIRAM), so dropping the flag needed no
    ; application-code changes; the ~55KB we use fits the 320KB internal SRAM
    ; with room to spare. Anything added later must budget for internal SRAM
    ; only.
    -DCORE_DEBUG_LEVEL=3
    ; Route `Serial` to the native USB CDC instead of UART0. The
    ; `m5stack-stamps3` board definition sets -DARDUINO_USB_MODE=1 but not
    ; -DARDUINO_USB_CDC_ON_BOOT, so HardwareSerial(0) stayed bound to the
    ; UART0 pins (GPIO43/44) and none of main.cpp's
    ; Serial.printf("quarky-cardputer-adv: ...") status lines reached the USB
    ; cable -- only ESP_LOGx/log_x traffic did, because that goes out through
    ; the VFS console on USB-Serial-JTAG. Found while verifying this PSRAM fix
    ; on real hardware: the board was demonstrably running setup() to
    ; completion, but its own progress markers were invisible over USB.
    ; Bruce's board definition for this same hardware
    ; (boards/_boards_json/m5stack-cardputer-adv.json) sets the same pair of
    ; flags.
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@^2.2.1
; Makes PlatformIO's Library Dependency Finder discover shared/c2proto
; (<proto.h>, <crypto.h>) and shared/feature_contract (<feature_registry.h>)
; -- first used by this task's hal/c2link_wifi.* and remote/command_dispatcher.*.
; Both live under shared/ as directories containing a src/ folder, which LDF
; auto-treats as libraries named after the directory, no library.json
; required. Same fix as Task 7/11 applied on the Tab5 side (see
; firmware/tab5/platformio.ini).
lib_extra_dirs = ../../shared
