[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git
; In-repo custom board (boards/quarky_tab5_p4.json + boards/variants/
; quarky_tab5_p4/pins_arduino.h). PlatformIO auto-discovers *.json in the
; project's boards/ directory, so no extra `boards_dir` setting is needed.
;
; WHY, not `esp32-p4-evboard` (what this used to be): the generic eval-board
; variant hardcodes the ESP32-P4-Function-EV-Board's GPIOs for the SDIO link
; to the ESP32-C6 radio co-processor (BOARD_SDIO_ESP_HOSTED_* =
; 18/19/14/15/16/17, reset 54). The real Tab5 wires that link to
; 12/13/11/10/9/8, reset 15. cores/esp32/esp32-hal-hosted.c bakes those macros
; into its SDIO pin config at compile time, so on real hardware esp-hosted
; drove the wrong pins: `H_SDIO_DRV: card init failed` ->
; `ensure_slave_bus_ready failed` -> `esp_wifi_init 0xffffffff` in a ~130ms
; retry loop until the brownout detector reset the chip, forever. Overriding
; via `-D BOARD_SDIO_ESP_HOSTED_CLK=12` etc. does NOT work -- the framework's
; macros are unconditional #defines with no #ifndef guard, so the header's
; (wrong) definition is seen later in preprocessing and wins.
;
; boards/quarky_tab5_p4.json is a deliberate minimal fork of the platform's
; esp32-p4-evboard.json, and the variant a minimal fork of variants/esp32p4/
; pins_arduino.h -- the ONLY functional difference in either is the seven C6
; SDIO pins. Everything Tasks 1/5/6/9/10 depend on (esp32p4/esp32p4_es mcu +
; chip_variant, qio/80MHz flash, 200MHz PSRAM, 16MB sizing, 1.5Mbaud upload,
; SDMMC slot 0 + power pins, the LDO VO4 auto-enable range covering the SD
; card's GPIO 39-48, default SDA/SCL 7/8, ETH) is carried over byte-for-byte.
; The platform's own `m5stack-tab5-p4` board was NOT used: it has the right C6
; pins but its m5stack_tab5 variant drops BOARD_SDMMC_POWER_*, drops the LDO
; macros, moves SDA/SCL to 53/54, and its companion .py force-installs
; M5Unified from git. See hotfix-c6-sdio-pins-report.md.
board = quarky_tab5_p4
board_build.mcu = esp32p4
board_build.flash_mode = qio
; Board has 16MB flash (per confirmed Tab5 hardware spec), but PlatformIO's
; esp32-p4-evboard definition has no board-specific default partition table,
; so it silently fell back to the framework's default.csv -- a dual-OTA
; scheme sized for a 4MB part (each app slot 0x140000 = 1,310,720 bytes).
; Found during Task 9 while investigating an 86.9%-flash-used build: that
; figure was measuring against the wrong, ~5x-too-small partition, not real
; physical flash scarcity. default_16MB.csv gives each app slot 0x640000
; (6,553,600 bytes), matching the actual hardware.
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    ; PlatformIO's project include/ dir isn't reliably propagated to the LDF's
    ; per-library SCons environments (confirmed: lvgl's own .c files failed to
    ; find "lv_conf.h" via #include "lv_conf.h" even with include/lv_conf.h
    ; present, until this flag was added explicitly) -- a known friction point
    ; integrating LVGL + LV_CONF_INCLUDE_SIMPLE with PlatformIO. Pass it
    ; explicitly rather than relying on the implicit project include path.
    -Iinclude
    ; Task 13 (BLE C2 transport): no NimBLE build flag is needed here. The
    ; earlier attempt to use the h2zero/NimBLE-Arduino lib_deps wrapper was
    ; abandoned -- it cannot compile for esp32p4 (its NimBLEDevice::init()
    ; calls the classic esp_bt_controller_* local-radio API from esp_bt.h,
    ; which does not exist for this radio-less chip; confirmed upstream at
    ; h2zero/NimBLE-Arduino#906 and in task-13-report.md's first section).
    ; Instead, src/hal/c2link_ble.cpp calls the ESP-IDF NimBLE host C API
    ; (nimble_port_init / ble_gatts_* / ble_gap_*) directly. That stack is
    ; already prebuilt and linkable in this pioarduino Arduino-ESP32 v3.3.11
    ; framework for esp32p4: sdkconfig ships CONFIG_BT_NIMBLE_ENABLED=y +
    ; CONFIG_BT_CONTROLLER_DISABLED=y, libbt.a / libespressif__esp_hosted.a
    ; are already in ld_libs, and the NimBLE include tree is already on the
    ; CPPPATH -- so no lib_deps entry and no build flag are required. The
    ; esp-hosted LL transport (ble_transport_ll_init) routes HCI to the C6
    ; co-processor, the same proxying used for WiFi (Task 9). See
    ; task-13-report.md (2026-08-07 section) for the full investigation.
; Task 9 (IRadio via esp-hosted WiFiRemote): no lib_deps or build_flags entry
; was added for esp-hosted here. For this pioarduino/Arduino-ESP32 v3.3.11
; esp32p4 target, the esp-hosted host-side component (espressif/esp_hosted,
; pinned via the framework's own dependencies.lock) ships precompiled inside
; framework-arduinoespressif32-libs, and its sdkconfig already has
; CONFIG_ESP_HOSTED_ENABLED=y / CONFIG_ESP_WIFI_REMOTE_ENABLED=y baked in --
; it is not an app-level dependency here. WiFiGenericClass::wifiLowLevelInit()
; already calls hostedInitWiFi() under that config before radio bring-up, so
; plain <WiFi.h> (see src/hal/radio_esp_hosted.cpp) is transparently backed
; by esp-hosted/SDIO to the Tab5's onboard ESP32-C6 co-processor, with no
; extra build flags required. See
; .superpowers/sdd/2026-08-06-tab5-foundation-plan/task-9-report.md.
lib_deps =
    lvgl/lvgl@^9.2.0
    ricmoo/QRCode@^0.0.1
; Makes PlatformIO's Library Dependency Finder discover shared/feature_contract
; (used starting this task, via <feature_registry.h>) and, once Task 11 adds
; shared/c2proto usage, that too -- both live under shared/ as directories
; containing a src/ folder, which LDF auto-treats as libraries named after
; the directory, no library.json required.
lib_extra_dirs = ../../shared
